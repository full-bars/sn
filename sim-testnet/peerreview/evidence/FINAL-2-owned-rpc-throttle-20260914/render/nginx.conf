# RPC gateway for snow — nginx reverse proxy in front of the archive and light
# Subtensor nodes (rendered by playbook-subtensor.yml from vars.yml). The
# archive remains on 9944 and the lightnode is exposed on
# 9946; both support Substrate WS and EVM HTTP/WS.
#
# The gateway is plaintext only on the restricted LAN and management tunnel.
# Nginx source-allowlists those networks, listeners bind only exact interface
# addresses, and the external firewall prevents public access to the host.
# Approved callers share unpaced ingress without per-client request or
# connection quotas; archive replay must not receive gateway-generated 429s.
user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;
worker_rlimit_nofile 1048576;

events {
    worker_connections 65536;
    multi_accept on;
}

http {
    server_tokens off;
    client_header_timeout 10s;
    client_body_timeout 10s;

    # WebSocket upgrade passthrough (substrate ws + EVM ws share the RPC port)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream subtensor_archive_rpc {
        server 127.0.0.1:9945;
        keepalive 128;
    }

    upstream subtensor_lightnode_rpc {
        server 127.0.0.1:9947;
        keepalive 128;
    }

    server {

        listen 172.28.208.185:9944;

        listen 192.168.1.162:9944;

        server_name _;
        client_max_body_size 4m;


        allow 172.28.208.0/24;

        allow 192.168.1.0/24;

        deny all;

        location / {
            limit_except GET POST {
                deny all;
            }

            proxy_pass http://subtensor_archive_rpc;
            proxy_http_version 1.1;

            # WebSocket
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;

            # Idle subscriptions reconnect instead of occupying a gateway
            # connection indefinitely.
            proxy_read_timeout  900s;
            proxy_send_timeout  900s;
            proxy_connect_timeout 10s;
            proxy_buffering off;
        }

        # gateway liveness — for the subnet's health checks
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }
    }

    server {

        listen 172.28.208.185:9946;

        listen 192.168.1.162:9946;

        server_name _;
        client_max_body_size 4m;


        allow 172.28.208.0/24;

        allow 192.168.1.0/24;

        deny all;

        location / {
            limit_except GET POST {
                deny all;
            }

            proxy_pass http://subtensor_lightnode_rpc;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_read_timeout  900s;
            proxy_send_timeout  900s;
            proxy_connect_timeout 10s;
            proxy_buffering off;
        }

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }
    }
}