# Area labels, applied automatically from the paths a PR touches.
# Consumed by .github/workflows/pr-labeler.yml (actions/labeler v5).
#
# The workflow was ported from the 3.23-fix fork but this mapping file
# never came with it, so every PR's "area" job has been failing with a
# labeler config 404 since the workflow was added. This is the missing
# config, adapted to this repo's own layout (provider + the Bittensor
# subnet/chain side, which the 3.23-fix fork doesn't have).
#
# Deliberately coarse: the goal is "which part of the repo does this touch"
# so a PR can be found again later, not a precise taxonomy. A PR touching
# several areas gets several labels; that is intended.

"area:provider":
  - changed-files:
      - any-glob-to-any-file:
          - "provider/**"
          - "cmd/provider/**"
          - "cli/miner/**"
          - "miner/**"
          - "internal/**"

"area:chain":
  - changed-files:
      - any-glob-to-any-file:
          - "validator/**"
          - "crv4/**"
          - "evm/**"
          - "merkle/**"
          - "ss58/**"
          - "stabi/**"
          - "mainnet/**"
          - "mainnnet/**"
          - "seed/**"
          - "payoutartifact/**"
          - "api/**"
          - "clientauth/**"

"area:cli":
  - changed-files:
      - any-glob-to-any-file:
          - "cli/**"
          - "stctl/**"
          - "cmd/**"
          - "tools/**"

"area:sim":
  - changed-files:
      - any-glob-to-any-file:
          - "sim-testnet/**"

"area:docker":
  - changed-files:
      - any-glob-to-any-file:
          - "docker/**"
          - "deploy/**"
          - "Dockerfile"

"area:ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**"

"area:scripts":
  - changed-files:
      - any-glob-to-any-file:
          - "scripts/**"

"area:docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "diagrams/**"
          - "*.md"
