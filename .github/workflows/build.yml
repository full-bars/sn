name: Build and Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'releases/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'releases/**'
    branches:
      - main
  workflow_dispatch:

# Supersede in-flight PR runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go (native cache)
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: go.sum

      - name: Run Go Unit Tests
        run: |
          for attempt in 1 2 3; do
            echo "=== go test attempt $attempt/3 ==="
            set +e
            go test -short -race -timeout 600s ./provider/... 2>&1 | tee /tmp/gotest.out
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -eq 0 ]; then
              echo "go test passed (attempt $attempt)"
              exit 0
            fi
            # Retry ONLY the known cache-restore flake
            if grep -qE "Cannot open: File exists|tar:.*Cannot open" /tmp/gotest.out; then
              echo "cache-restore flake detected; clearing build cache and retrying"
              go clean -cache
              sleep 5
              continue
            fi
            echo "genuine test failure — not retrying"
            exit "$rc"
          done
          echo "go test still flaking after 3 attempts"
          exit 1

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go (native cache)
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: go.sum

      - name: Run go vet
        run: |
          go vet ./provider/...

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l provider/)
          if [ -n "$unformatted" ]; then
            echo "Files not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run vulnerability check
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
