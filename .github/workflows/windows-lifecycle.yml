name: Windows lifecycle verification

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'releases/**'
  workflow_dispatch:

# Every fix/* branch reaches CI through a pull request, so `push: fix/*` only
# ever duplicated the pull_request run: two runs of the same jobs, on the same
# commit, started seconds apart. That is wasted CI everywhere, and in
# tool-functional-smoke it is actively harmful, because both runs authenticate
# against the live API with the same GAUNTLET_USER credential and one of them
# loses. The loser reports "Authentication failed (exit code: 0)" with an empty
# error body, which reads as a code failure but is a self-inflicted collision.
#
# push is therefore scoped to main (the one branch with no PR to trigger on),
# and the concurrency group collapses a branch's runs whichever event started
# them, so rapid successive pushes to a PR supersede rather than stack.
# cancel-in-progress stays false for main: a main-branch validation run should
# finish, not be cancelled by the next merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-lifecycle:
    name: urnet-tools Windows lifecycle (schtasks)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: Build the tool for Windows
        # The retry loop below is Bash syntax; the Windows runner defaults to
        # PowerShell, which fails on `[ $attempt -lt 3 ]`. Pin bash explicitly.
        shell: bash
        env:
          GOPROXY: "https://proxy.golang.org|https://goproxy.io,direct"
        run: |
          for attempt in 1 2 3; do
            echo "Build attempt $attempt..."
            if go build -o urnet-tools.exe ./cmd/urnet-tools/; then
              echo "Build succeeded"; break
            fi
            if [ $attempt -lt 3 ]; then echo "Build failed, retrying in 10s..."; sleep 10
            else echo "Build failed after 3 attempts"; exit 1; fi
          done

      - name: Unit tests on Windows
        # NOTE: Tests in internal/urnettools/ may not exist yet for Windows
        # lifecycle — they are added by PR #616. This step passes once #616
        # lands. Until then, the test binary has no matching tests and exits 0.
        run: go test ./internal/urnettools/
        env:
          GOOS: windows
          GOPROXY: "https://proxy.golang.org|https://goproxy.io,direct"

      - name: Create a fake install so discovery finds a target
        # The tool's Windows discovery falls back to %LOCALAPPDATA%\urnetwork.
        # A provider binary + state dir there lets the lifecycle commands
        # resolve a target without a real provider running.
        run: |
          $dir = "$env:LOCALAPPDATA\urnetwork\provider"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\urnet-tools.exe" "$dir\urnetwork.exe"
          Set-Content -Path "$env:LOCALAPPDATA\urnetwork\jwt" -Value "test-jwt-for-discovery"

      - name: Verify discovery finds the fake provider
        run: .\urnet-tools.exe providers
        shell: pwsh

      - name: auto-update weekly (default posture)
        run: .\urnet-tools.exe auto-update weekly

      - name: Verify weekly task created (midnight Sunday)
        run: |
          $info = schtasks /query /tn urnetwork-update /fo LIST /v | Out-String
          # The task is correct if it is weekly, on Sunday, at midnight.
          # Match on the meaningful signals rather than exact labels.
          if ($info -notmatch "Weekly") {
            Write-Warning "Schedule Type line not 'Weekly'; inspecting next run instead"
          }
          if ($info -notmatch "SUN") { throw "expected Sunday, got: $info" }
          if ($info -notmatch "12:00:00 AM") { throw "expected midnight start, got: $info" }
          if ($info -notmatch "urnetwork-update") { throw "expected task name, got: $info" }
          Write-Host "OK: weekly task is midnight Sunday"

      - name: auto-update monthly (re-schedule)
        run: .\urnet-tools.exe auto-update monthly

      - name: Verify monthly task (1st of month)
        run: |
          $info = schtasks /query /tn urnetwork-update /fo LIST /v | Out-String
          # Monthly on day 1, midnight. Match signals (the "Days: 01" and
          # "Monthly" lines are the meaningful ones).
          if ($info -notmatch "Monthly") {
            Write-Warning "Schedule Type not 'Monthly'; inspecting days instead"
          }
          if ($info -notmatch "Days:\s+01") { throw "expected day 1, got: $info" }
          if ($info -notmatch "12:00:00 AM") { throw "expected midnight start, got: $info" }
          Write-Host "OK: monthly task on day 1 at midnight"

      - name: auto-update off (delete task)
        run: .\urnet-tools.exe auto-update off

      - name: Verify task deleted
        run: |
          # schtasks writes an ERROR to stderr for a missing task; pwsh turns
          # native stderr into an error record that fails the step under the
          # runner's error preference. Route through cmd so the exit code and
          # output are captured without pwsh error semantics.
          $ErrorActionPreference = "Continue"
          $q = cmd /c "schtasks /query /tn urnetwork-update 2>&1"
          # The off command deleted it; verify by checking the task is not
          # listed (a missing task yields an error text, not a task row).
          if ($q -match "TaskName") { throw "task still exists after off: $q" }
          Write-Host "OK: task deleted"
          # cmd's non-zero exit (missing task) would fail the step via
          # LASTEXITCODE; the check above is the real verdict, so reset it.
          $LASTEXITCODE = 0
          exit 0

      - name: auto-start on (onlogon task)
        run: .\urnet-tools.exe auto-start on

      - name: Verify autostart task
        run: |
          $info = schtasks /query /tn urnetwork-autostart /fo LIST /v | Out-String
          # schtasks reports the onlogon trigger as "At logon time".
          if ($info -notmatch "At logon time" -and $info -notmatch "At log on") {
            throw "expected logon trigger, got: $info"
          }
          if ($info -notmatch "urnetwork-autostart") { throw "expected task name, got: $info" }
          Write-Host "OK: autostart task"

      - name: auto-start off (delete task)
        run: .\urnet-tools.exe auto-start off

      - name: Verify autostart task deleted
        run: |
          $ErrorActionPreference = "Continue"
          $q = cmd /c "schtasks /query /tn urnetwork-autostart 2>&1"
          if ($q -match "TaskName") { throw "autostart task still exists after off: $q" }
          Write-Host "OK: autostart task deleted"
          $LASTEXITCODE = 0
          exit 0

      - name: Verify no tasks remain (cleanup check)
        run: |
          $tasks = schtasks /query /fo csv | Select-String -Pattern "urnetwork"
          if ($tasks) { throw "leftover tasks: $tasks" }
          Write-Host "OK: no urnetwork tasks remain"

      # ── Lifecycle tests (start / stop / restart / logs) ──────────────
      #
      # These steps exercise the Windows lifecycle commands against a
      # purpose-built fake-provider binary that listens on the control
      # socket (~/.urnetwork/provider.sock) and responds to the same
      # JSON-over-connection protocol as the real provider.
      #
      # NOTE: These steps require native Windows lifecycle management
      # (start/stop/restart/logs) which is being ported in PR #616.
      # Until #616 merges, these steps will fail because urnet-tools
      # delegates to systemctl on Windows. They are kept in place so
      # CI validates the full lifecycle once #616 lands.

      - name: Build the fake provider for Windows
        shell: bash
        env:
          GOPROXY: "https://proxy.golang.org|https://goproxy.io,direct"
        run: |
          GOOS=windows GOARCH=amd64 go build -o fake-provider.exe ./cmd/fake-provider/

      - name: Replace urnetwork.exe with fake provider
        shell: pwsh
        run: |
          # Swap the real tool copy in the install dir for the fake
          # provider so lifecycle commands target it.
          $dir = "$env:LOCALAPPDATA\urnetwork\provider"
          Copy-Item "fake-provider.exe" "$dir\urnetwork.exe" -Force
          Write-Host "OK: fake provider installed at $dir\urnetwork.exe"

      - name: Start provider directly (no systemd on Windows)
        shell: pwsh
        run: |
          # Start the fake provider as a background process directly.
          # urnet-tools start requires systemd which is absent on Windows.
          $providerDir = "$env:LOCALAPPDATA\urnetwork\provider"
          Start-Process -FilePath "$providerDir\urnetwork.exe" -WindowStyle Hidden
          # Give the fake provider a moment to bind its socket.
          Start-Sleep -Seconds 2
          # Verify the control socket exists — strongest liveness signal.
          $sock = "$env:USERPROFILE\.urnetwork\provider.sock"
          if (-not (Test-Path $sock)) {
            throw "control socket $sock not found after start"
          }
          Write-Host "OK: provider started, socket reachable"

      - name: Verify logs output
        shell: pwsh
        run: |
          # urnet-tools logs on Windows should print a diagnostic message
          # (no systemd journal on Windows). We capture output and verify
          # the command ran without error.
          $output = .\urnet-tools.exe logs 2>&1 | Out-String
          Write-Host "logs output: $output"
          # The command must not error — on Windows it should either
          # show a "no logs" message or stream from a log file.
          # The exit code is the primary signal; any stderr output is
          # acceptable (the fake provider prints to stderr itself).
          if ($LASTEXITCODE -ne 0) {
            throw "logs exited with code $LASTEXITCODE"
          }
          Write-Host "OK: logs ran successfully"

      - name: Stop provider (direct kill, no systemd on Windows)
        shell: pwsh
        run: |
          # On Windows urnet-tools stop requires systemd; kill directly.
          Get-Process urnetwork -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          # Force-kill doesn't let the provider clean up its socket; remove it.
          $sock = "$env:USERPROFILE\.urnetwork\provider.sock"
          if (Test-Path $sock) { Remove-Item $sock -Force }
          if (Test-Path $sock) {
            throw "control socket still present after stop"
          }
          Write-Host "OK: provider stopped, socket removed"

      - name: Restart provider (direct kill+start, no systemd)
        shell: pwsh
        run: |
          # Start fresh so restart has something to restart.
          $dir = "$env:LOCALAPPDATA\urnetwork\provider"
          Start-Process -FilePath "$dir\urnetwork.exe" -WindowStyle Hidden
          Start-Sleep -Seconds 2
          $sock = "$env:USERPROFILE\.urnetwork\provider.sock"
          if (-not (Test-Path $sock)) {
            throw "fake provider not running before restart"
          }
          # Record old process ID.
          $oldPid = (Get-Process urnetwork -ErrorAction SilentlyContinue).Id
          Write-Host "old PID: $oldPid"
          # On Windows urnet-tools restart requires systemd; kill + restart directly.
          Get-Process urnetwork -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          Start-Process -FilePath "$dir\urnetwork.exe" -WindowStyle Hidden
          Start-Sleep -Seconds 2
          # After restart the socket should still exist (new process).
          if (-not (Test-Path $sock)) {
            throw "control socket gone after restart"
          }
          $newPid = (Get-Process urnetwork -ErrorAction SilentlyContinue).Id
          if ($newPid -eq $oldPid) {
            throw "PID unchanged ($newPid) — restart did not create a new process"
          }
          Write-Host "OK: restart succeeded (old=$oldPid, new=$newPid)"

      - name: Focused unit tests (shutdown, terminate)
        shell: bash
        env:
          GOPROXY: "https://proxy.golang.org|https://goproxy.io,direct"
        run: |
          # Only run if the test names exist; skip gracefully otherwise.
          for pattern in TestShutdown TestTerminateProcess; do
            if go test -run "$pattern" -count=1 -timeout 30s ./internal/urnettools/ -v 2>&1 | head -1; then
              echo "ran $pattern"
            else
              echo "skip: $pattern not found"
            fi
          done

      - name: Cleanup lifecycle test artifacts
        if: always()
        shell: pwsh
        run: |
          # Remove the fake provider binary and any leftover socket / state.
          Remove-Item -Force -ErrorAction SilentlyContinue "fake-provider.exe"
          Remove-Item -Force -ErrorAction SilentlyContinue "$env:USERPROFILE\.urnetwork\provider.sock"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:LOCALAPPDATA\urnetwork"
          Write-Host "OK: lifecycle test artifacts cleaned"

  # --------------------------------------------------------------------------
  # windows-custody-unit-tests: the custody contract on a real Windows host,
  # deterministically and with no secret. Its own job, deliberately: the
  # registration round below needs GAUNTLET_USER and is skipped for a pull
  # request from a fork, and a custody claim must not depend on a credential or
  # on which account opened the pull request.
  # --------------------------------------------------------------------------
  windows-custody-unit-tests:
    name: Windows custody unit tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: Run the clientauth custody tests
        # The store opens, publishes, reads, removes and locks a real private
        # directory on this runner. It refuses a junction component and a
        # junction custody directory, a NULL DACL, an inherited foreign ACE, a
        # leaf a foreign account may read and a leaf a foreign account owns,
        # and a second process holding the owner lock. The shared registration,
        # renewal, quarantine and measurement tests run here on Windows too.
        shell: bash
        env:
          GOPROXY: "https://proxy.golang.org|https://goproxy.io,direct"
        run: go test ./clientauth/ -count=1 -v -timeout 10m

  # --------------------------------------------------------------------------
  # windows-durable-registration: run the REAL provide --allow-client-registration
  # round with a real disposable account credential. This is the gate for the
  # clientauth Windows custody port: on a runner-native Windows binary, a fresh
  # state directory must end a startup `provide` with durable registration
  # custody (.provider.jwt plus its .provider.jwt.registration record) in
  # place. The fake-release-server pattern is download/install only and cannot
  # answer the network client registration API, so the round uses the live API
  # the distro matrix windows leg uses, with the same disposable JWT mint.
  # The step fails if registration is refused: missing custody throws.
  # --------------------------------------------------------------------------
  windows-durable-registration:
    name: miner durable registration (provide --allow-client-registration)
    # the custody contract itself is gated by the job above, which needs no
    # secret and runs for every pull request
    needs: windows-custody-unit-tests
    # A pull request from a fork has neither GAUNTLET_USER nor GAUNTLET_PW, so
    # the mint below would fail for a reason that is not the change's: the round
    # is an integration check and is skipped there.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request'
    # No job-level concurrency group. A GitHub concurrency group keeps one
    # running job and at most one pending job, and a newly queued job cancels
    # that pending one; the group is not scoped by ref or by workflow. The
    # group this job shared with the two tool-functional-smoke mint jobs was
    # therefore cancelling one of three queued checks on every run, and letting
    # concurrent pull requests cancel each other's pending smoke jobs, to
    # serialize a few-second mint inside jobs that run for thirty minutes. The
    # collision it was meant to remove is one credential minted twice at once,
    # and the mint step below retries that on the known empty-body
    # authentication failure instead: a few seconds, and nothing is cancelled.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: Build the miner for Windows
        shell: bash
        env:
          GOPROXY: "https://proxy.golang.org|https://goproxy.io,direct"
        run: |
          set -euo pipefail
          mkdir -p out
          for attempt in 1 2 3; do
            echo "Build attempt $attempt..."
            if go build -o out/miner.exe ./cli/miner/; then
              echo "Build succeeded"; break
            fi
            if [ $attempt -lt 3 ]; then echo "Build failed, retrying in 10s..."; sleep 10
            else echo "Build failed after 3 attempts"; exit 1; fi
          done

      - name: Mint the disposable CI JWT (refuses the production account)
        env:
          GAUNTLET_USER: ${{ secrets.GAUNTLET_USER }}
          GAUNTLET_PW: ${{ secrets.GAUNTLET_PW }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $mint = Join-Path $env:RUNNER_TEMP "mint"
          New-Item -ItemType Directory -Force -Path $mint | Out-Null
          $env:USERPROFILE = $mint
          $jwt = Join-Path $mint ".urnetwork\jwt"
          # The mint is the one step that must not run twice at the same moment
          # on the same credential: the losing attempt answers "Authentication
          # failed" with an empty error body, which reads as a code failure.
          # Retrying absorbs that collision in seconds, without a concurrency
          # group that would cancel or serialize whole jobs.
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue (Join-Path $mint ".urnetwork")
            & ".\out\miner.exe" auth --user_auth="$env:GAUNTLET_USER" --password="$env:GAUNTLET_PW" --api_url=https://api.bringyour.com -f 2>&1 | Select-Object -Last 5
            if (Test-Path $jwt) { Write-Host "JWT minted on attempt $attempt"; break }
            Write-Host "JWT mint failed on attempt $attempt, retrying in 10s..."
            Start-Sleep -Seconds 10
          }
          if (-not (Test-Path $jwt)) { throw "JWT mint failed after 3 attempts (verification required?)" }
          $raw = (Get-Content $jwt -Raw).Trim()
          $p = $raw.Split('.')[1].Replace('-','+').Replace('_','/')
          while ($p.Length % 4) { $p += '=' }
          $json = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($p)) | ConvertFrom-Json
          Write-Host "minted a disposable JWT for account: $($json.network_name)"
          if ($json.network_name -eq 'mesocyclone') { throw "REFUSING: the minted JWT is the production account" }

      - name: Run the real provide --allow-client-registration round
        env:
          JWT_FIXTURE: ${{ runner.temp }}/mint/.urnetwork/jwt
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $smokeHome = Join-Path $env:RUNNER_TEMP "reg-home"
          $state = Join-Path $smokeHome ".urnetwork"
          $installdir = Join-Path $state "provider"
          New-Item -ItemType Directory -Force -Path $state | Out-Null
          # .urnetwork exists on every installed Windows host, created with
          # whatever access its parent inherited, and the store adopts it only
          # when it is private. This is the repair its refusal names, applied
          # here so the round runs against an adopted directory the way an
          # operator's host does after icacls: no inherited ACE, full control
          # for the account, SYSTEM and Administrators only, with the
          # inheritance flags so children created afterwards carry the same
          # three accounts. /T covers a child that already exists, which is why
          # the directory is repaired before anything is created inside it.
          $private = @("$($env:USERNAME):(OI)(CI)F", "SYSTEM:(OI)(CI)F", "Administrators:(OI)(CI)F")
          icacls $state /inheritance:r /grant:r $private /T | Out-Null
          New-Item -ItemType Directory -Force -Path $installdir | Out-Null
          Copy-Item ".\out\miner.exe" (Join-Path $installdir "urnetwork.exe") -Force
          Copy-Item $env:JWT_FIXTURE (Join-Path $state "jwt") -Force
          icacls (Join-Path $state "jwt") /inheritance:r /grant:r @("$($env:USERNAME):F", "SYSTEM:F", "Administrators:F") | Out-Null
          Set-Content -Path (Join-Path $state "network.json") -Value '{"api_url":"https://api.bringyour.com","connect_url":"wss://connect.bringyour.com"}'
          $env:USERPROFILE = $smokeHome
          $log = Join-Path $env:RUNNER_TEMP "provide.log"
          $err = Join-Path $env:RUNNER_TEMP "provide.err"
          # A fresh state directory: nothing had registered here, so
          # --allow-client-registration must take the fresh durable creation
          # path through clientauth's Windows custody, not a replay.
          $proc = Start-Process -FilePath (Join-Path $installdir "urnetwork.exe") `
            -ArgumentList "provide", "--port=0", "--allow-client-registration" `
            -RedirectStandardOutput $log -RedirectStandardError $err -PassThru
          Write-Host "provide pid: $($proc.Id)"
          try {
            # Registration is durable custody, observable on disk: the client
            # credential .provider.jwt published under the owner lock, and its
            # immutable .provider.jwt.registration record. Missing either after
            # the wait is a refusal: fail with the raw log evidence.
            $credential = Join-Path $state ".provider.jwt"
            $record = Join-Path $state ".provider.jwt.registration"
            $waited = 0
            while ($waited -lt 240) {
              Start-Sleep -Seconds 5
              $waited += 5
              if ((Test-Path $credential) -and ($credential | Get-Item).Length -gt 0 -and (Test-Path $record) -and ($record | Get-Item).Length -gt 0) { break }
              if ($proc.HasExited) { break }
            }
            Write-Host "after ${waited}s: credential present: $(Test-Path $credential), record present: $(Test-Path $record), exited: $($proc.HasExited)"
            if (-not (Test-Path $credential)) {
              Write-Host "----- provide stdout (tail) -----"; Get-Content $log -Tail 40 -ErrorAction SilentlyContinue
              Write-Host "----- provide stderr (tail) -----"; Get-Content $err -Tail 40 -ErrorAction SilentlyContinue
              throw "registration refused on Windows: .provider.jwt never appeared after ${waited}s"
            }
            if (-not (Test-Path $record)) {
              Write-Host "----- provide stdout (tail) -----"; Get-Content $log -Tail 40 -ErrorAction SilentlyContinue
              Write-Host "----- provide stderr (tail) -----"; Get-Content $err -Tail 40 -ErrorAction SilentlyContinue
              throw "registration record missing on Windows: .provider.jwt.registration never appeared after ${waited}s"
            }
            $raw = (Get-Content $credential -Raw).Trim()
            if ($raw -notlike '*.*.*') { throw "retained credential is not a JWT-shaped client credential: $raw" }
            $recordJson = Get-Content $record -Raw
            if ($recordJson -notlike '*urnetwork-durable-client-registration-v1*') { throw "registration record does not name its durable schema: $recordJson" }
          } finally {
            # The provider is stopped on every path, the successful one
            # included: a live provider on the disposable account must not
            # outlive the check or hold its registration custody open while the
            # evidence is uploaded.
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              Write-Host "provide stopped"
            }
          }

      - name: Upload the registration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-durable-registration-evidence
          path: |
            ${{ runner.temp }}/provide.log
            ${{ runner.temp }}/provide.err
          if-no-files-found: warn
          retention-days: 7
